[package]
name = "hpwarn"
version = "1.8.0"
edition = "2021"
description = "Minimal SWTOR HP warning overlay: shows your HP% when it drops below a threshold and beeps once."

[[bin]]
name = "hpwarn"
path = "src/main.rs"

[dependencies]
# "wayland"/"x11" here are just Cargo features that toggle code paths inside
# eframe/egui-winit/winit; the actual Wayland/X11 *crates* those pull in are
# themselves declared only as `[target.'cfg(unix ...)'.dependencies]` deep in
# winit's own Cargo.toml, so this line is already fine cross-platform (on
# Windows, winit simply uses its Win32 backend instead) - no per-platform
# split needed here.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
dirs = "5"
rodio = { version = "0.19", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Only used by src/wayland_overlay.rs, hpwarn's native wlr-layer-shell
# overlay - a Linux/Wayland-only mechanism that exists to route around a
# Linux-compositor-specific quirk (see overlay.rs). Declaring these as
# Linux-only dependencies (rather than plain [dependencies]) means a Windows
# build doesn't even try to compile wayland-client/rustix, which wouldn't
# work there anyway - and wasn't needed there in the first place, since
# Windows' native always-on-top just works.
[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "0.38", features = ["fs", "mm"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true

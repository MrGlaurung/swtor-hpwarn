[package]
name = "hpwarn"
version = "1.8.11"
edition = "2021"
description = "Minimal SWTOR HP warning overlay: shows your HP% when it drops below a threshold and beeps once."

[[bin]]
name = "hpwarn"
path = "src/main.rs"

[dependencies]
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
dirs = "5"
rodio = { version = "0.19", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
env_logger = "0.11"
# Software text rendering (src/text_canvas.rs), shared by the two overlay
# backends that paint their own pixels directly instead of going through
# eframe/egui at all: the Linux layer-shell overlay (wayland_overlay.rs) and
# the Windows native layered-window overlay (win_overlay.rs). Pure, portable
# Rust with no platform-specific code, so it's fine to always pull in.
ab_glyph = "0.2"

# Only used by src/wayland_overlay.rs, hpwarn's native wlr-layer-shell
# overlay - a Linux/Wayland-only mechanism that exists to route around a
# Linux-compositor-specific quirk (see overlay.rs).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "0.38", features = ["fs", "mm"] }
# "wayland"/"x11" here are just Cargo features that toggle code paths inside
# eframe/egui-winit/winit; the actual Wayland/X11 *crates* those pull in are
# themselves declared only as `[target.'cfg(unix ...)'.dependencies]` deep in
# winit's own Cargo.toml. The "glow" (OpenGL) render backend works fine here:
# a compositing window manager (X11) or Wayland itself already does real
# per-pixel alpha compositing for an OpenGL window, so the overlay's
# transparency just works.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Windows: eframe/winit have no reliable way to give a window real per-pixel
# transparency here (see the long comment in src/win_overlay.rs for why both
# "glow" and "wgpu" were tried and ruled out), so the overlay is a small,
# dedicated native Win32 window instead (src/win_overlay.rs), using the
# `UpdateLayeredWindow` API - the same mechanism real Windows HUD/overlay
# utilities use for exactly this. It runs on its own thread, entirely outside
# eframe/winit, so the dashboard goes back to being a plain, independent
# `eframe::run_native` call again (same shape as Linux) - no shared/combined
# event loop trickery needed, and no reason to need "wgpu" here either.
[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

# macOS (anything that's neither Linux nor Windows): kept on the combined
# dashboard+overlay app with the "wgpu" backend from the last round. macOS's
# windowing (Core Animation) doesn't have Windows' transparency problem, so
# this was never confirmed broken there the way it was on Windows - and
# nothing in this app has ever actually been run on a Mac. Left alone rather
# than guessed at further.
[target.'cfg(not(any(target_os = "linux", target_os = "windows")))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true

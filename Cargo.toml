[package]
name = "hpwarn"
version = "1.8.9"
edition = "2021"
description = "Minimal SWTOR HP warning overlay: shows your HP% when it drops below a threshold and beeps once."

[[bin]]
name = "hpwarn"
path = "src/main.rs"

[dependencies]
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
dirs = "5"
rodio = { version = "0.19", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Only used by src/wayland_overlay.rs, hpwarn's native wlr-layer-shell
# overlay - a Linux/Wayland-only mechanism that exists to route around a
# Linux-compositor-specific quirk (see overlay.rs). Declaring these as
# Linux-only dependencies (rather than plain [dependencies]) means a Windows
# build doesn't even try to compile wayland-client/rustix, which wouldn't
# work there anyway - and wasn't needed there in the first place, since
# Windows' native always-on-top just works.
[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "0.38", features = ["fs", "mm"] }
# "wayland"/"x11" here are just Cargo features that toggle code paths inside
# eframe/egui-winit/winit; the actual Wayland/X11 *crates* those pull in are
# themselves declared only as `[target.'cfg(unix ...)'.dependencies]` deep in
# winit's own Cargo.toml. The "glow" (OpenGL) render backend works fine here:
# a compositing window manager (X11) or Wayland itself already does real
# per-pixel alpha compositing for an OpenGL window, so the overlay's
# transparency just works.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# Windows (and macOS) use the "wgpu" render backend instead of "glow"
# (OpenGL). This isn't a style choice: plain OpenGL (WGL) windows on Windows
# cannot be made to composite with real per-pixel transparency at all - DWM
# always treats a WGL swap chain as fully opaque, no matter what alpha the
# app renders into it (this is a long-standing, widely-documented Windows/
# OpenGL limitation, not a bug in this app's own code - see e.g.
# https://github.com/rust-windowing/winit/issues/2032). `wgpu`'s DX12/Vulkan
# backends use DXGI's "flip model" swap chains instead, which Windows *does*
# support a transparent `CompositeAlphaMode` for, and which is exactly what
# `run_combined` (see main.rs) needs for the overlay to actually be
# see-through there, with the dashboard window staying fully opaque by
# simply never rendering anything below alpha 255 (also see main.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
